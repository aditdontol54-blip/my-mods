plugins {
    id 'java'
    // ModDevGradle "legacy" plugin: builds mods for Forge/NeoForge 1.20.1
    id 'net.neoforged.moddev.legacyforge' version '2.0.115'
}

version = mod_version
group = 'com.danish.chronoarsenal'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Forge 47 API. NeoForge 1.20.1 (47.1.x) is a fork of Forge 47, so the
    // resulting jar runs on both NeoForge 1.20.1 and Forge 1.20.1.
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
